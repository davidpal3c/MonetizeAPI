# Render Blueprint — Docker web service for Agnic OAuth + /agnic/proof
# https://render.com/docs/blueprint-spec
#
# Set these in the Render dashboard (or link as secrets):
#   AGNIC_CLIENT_ID
#   AGNIC_CLIENT_SECRET
#   AGNIC_PARTNER_ID
#   AGNIC_REDIRECT_URI  → https://<your-service>.onrender.com/auth/callback
# Optional: AGNIC_BASE_URL, AGNIC_MODEL=qwen/qwen3.5-flash-02-23, AGNIC_OAUTH_SCOPES
# AGNIC_PARTNER_ID must be partner_… (not app_…). Top-up return_url uses AGNIC_REDIRECT_URI.

services:
  - type: web
    name: monetizeapi-web-proof
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOSTNAME
        value: 0.0.0.0
